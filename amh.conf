# amh.conf — this repository's Agentic Maintenance Harness settings.
#
# The five shipped scripts under scripts/ are parameter-free and read this file at
# runtime. Change values HERE; never edit the shipped scripts locally (a guard checks
# they stay byte-identical to harness/templates/scripts/).
#
# Sourced by bash. Keep it to simple KEY=value assignments.

# The harness version this repository has adopted (AMH semver).
AMH_VERSION=9.2.0

# --- Git topology (AMH P13) -------------------------------------------------
DEFAULT_BRANCH=main
BRANCH_PREFIX=session
# branch-per-change | branch-train
#
# branch-train, by owner decision 2026-07-26. This repo's session branches are cut from
# the previous one and contain it whole, so only the final superset branch merges, in
# ONE squash PR whose body describes the net origin/main..HEAD diff. The config said
# branch-per-change while the repository had been a train since its second branch — the
# declaration was what was wrong, not the topology.
MERGE_MODE=branch-train

# Environment flag that marks a remote/ephemeral container. Session bootstrap runs
# toolchain setup only when this is 1 — never a heuristic (AMH P14).
REMOTE_FLAG=AMH_REMOTE

# --- Release window (session-start banner) ----------------------------------
# The version file, and the prefix that turns its contents into a tag name. Both set here
# because this repo's README pins a clone target of the form amh-v<VERSION>, so the interval
# between merging a bump and cutting the tag is one where the documented install command 404s
# and every guard is green (DA-010). The banner states the fact each session; it enforces
# nothing, which is the honest layer for a state only the owner can resolve. Leave both empty
# in a repo that does not tag releases and the line disappears.
VERSION_FILE=harness/VERSION
RELEASE_TAG_PREFIX=amh-v

# --- Runtime inventory (session-start banner) -------------------------------
# The reported STATES are consumed by nothing (DA-024). The ADAPTER_FILES *list* is drift-checked
# by scripts/guards/adapter-set.sh, which reads the paths and never a state — that distinction is
# the whole of what DA-024(b) permits, so keep it exact. Tools are probed with
# `type -P` (PATH only — `command -v` resolves builtins and functions, which would report this
# script's own helpers as installed tools) and reported observed/unavailable; adapter files are
# configured/unknown, never observed and never unavailable — presence is a request for an
# integration, not evidence a hook fired, and absence here is not evidence none exists.
# shellcheck is deliberately listed: it is CI-only in this repo (D-026) and its rung is
# load-bearing, so a local session being told it is unavailable is the point, not a defect.
REQUIRED_TOOLS='git sed awk grep shellcheck'
# The first-class adapter set, held in lockstep with the other five places it appears by
# scripts/guards/adapter-set.sh — a sixth list that could drift silently is exactly what
# that guard exists to prevent.
ADAPTER_FILES='.claude/settings.json .codex/config.toml .codex/rules/amh.rules .codex/agents/amh-rule-reviewer.toml'

# --- Working memory: docs/STATE.md size band (AMH P2, hysteresis) -----------
# Grow freely to WARN. Over WARN, one deep compression pass must land at or below
# COMPRESS_TO — landing in the band between them fails. Over HARD fails outright.
#
# The floor is BOTH keys below, and a landing has to satisfy both. Neither works alone.
# A byte floor can be reached by shaving words — the reflex that produced a landing 7 bytes
# under it — while a sentence floor can be reached by rewriting `. T` to `; t`, which on
# this file takes 85 sentences to 41 and frees not one byte. Each number blocks the cheap
# move that satisfies the other: bytes make the repunctuation pointless, sentences make the
# shave pointless, and folding whole completed stages is what satisfies both at once.
# WARN and HARD stay byte-only because they answer WHEN to compress, not how far, and
# nobody drafts toward them.
#
# Calibration, and the way the sentence key can go stale: at ~170 bytes per sentence here,
# 50 sentences is roughly 8.5 KB, so the two floors bite at about the same place rather
# than one being decorative. If this file's prose becomes markedly denser or sparser per
# sentence, that alignment moves and the number is due a re-read. Nothing checks the
# correspondence, because nothing can: it is a property of prose, not of a file size.
STATE_FILE=docs/STATE.md
STATE_COMPRESS_TO_KB=9
STATE_COMPRESS_TO_SENTENCES=50
STATE_WARN_KB=14
STATE_HARD_KB=16
# Above WARN, a shrink smaller than this is an ordinary edit — a typo fix, a closed
# queue item — and is allowed with the warning still armed. A shrink this size or larger
# is a compression pass and must reach COMPRESS_TO. Set it in the empty gap between the
# two populations: no ordinary edit runs to 1 KB, no real compression pass is under 5.
STATE_EDIT_DELTA_BYTES=1024

# Section headers that must survive compression. '|' separated.
STATE_REQUIRED_SECTIONS='## Project|## Current state|## Changelog'
# Protected section whose disappearance is a warning, not a failure.
STATE_OWNER_QUEUE_SECTION='## Owner queue'

# --- Permanent memory: the append-only ledger (AMH P2, P11) -----------------
LEDGER_DIR=docs
LEDGER_BASENAME=LEDGER
LEDGER_LINE_CAP=800
# The working limit on a new row, and the one a draft is written toward. It counts
# SENTENCES for the reason the state floor does: an over-length draft cannot be reworded
# into compliance, only shortened by a whole sentence, so "maximum, not a target" stops
# depending on the author's restraint. Six sits at the top of the observed shape of this
# repository's recent rows, which measure three to six with a mode of five — four of the
# last fourteen are already at six, so this cap does bite, and that is the intent: a row
# with a seventh sentence loses one. Historical rows already committed at HEAD are exempt
# so append-only history is never rewritten.
LEDGER_ROW_SENTENCE_CAP=6
# The backstop, not the working limit, and not a number to draft against: it exists for the
# one shape the sentence cap cannot see, six sentences that each run hundreds of bytes.
# Calibrated rather than guessed, and the honest figure is worth stating: measured over
# every row in this repository, the longest sentence-compliant one is ~1450 bytes (six
# sentences at ~240 each), so 2000 leaves about a quarter of headroom above a maximally
# dense compliant row. Not "far above" — no value is both far above that and a real bound
# on read cost. If a draft approaches it, the answer is docs/history/ with a pointer from
# the state changelog, never tighter wording. Counted as bytes under LC_ALL=C.
# Not the same unit as LEDGER_LINE_CAP above, which counts lines in a whole volume.
LEDGER_ROW_CHAR_CAP=2000

# Where citations are scanned for. Code and workflows only — NOT docs, and not the
# guard fixtures (which contain synthetic IDs by design).
#
# scripts/guards/shipped-citations.sh hardcodes the SAME fixture-suite exclusion, because it
# has to know which shipped file is allowed to carry synthetic IDs. Change the value below and
# that guard's EXCLUDE_BASENAMES is wrong; change the shipped default in
# harness/templates/amh.conf.example and both are.
CITATION_SCAN_PATHS='scripts .github'
CITATION_EXCLUDE='scripts/test-ladder-guards.sh scripts/tests'

# --- Commit hygiene ---------------------------------------------------------
# Fixed strings that must never reach a commit message: a squash merge would fold
# them onto the default branch, and force-push is forbidden, so it would be permanent.
POISON_TOKENS='[skip ci]|[ci skip]|***NO_CI***'

# --- Git author identity ----------------------------------------------------
# Every author and committer address on a branch must match this extended regex WHOLE.
# The rung fails on git's self-invented identities (root@host, @localhost, @host.local,
# no @ at all) whether or not this key is set; what the key adds is "and it must be one of
# OURS", which is the half that catches the leak this repo actually worries about — the
# owner's personal address arriving in commit metadata, where no force-push may remove it.
# Note the ordering, because it is a real consequence and not a detail: an address this
# regex admits is accepted WHATEVER SHAPE IT HAS, invented ones included. That is the
# escape hatch for a repo whose real addresses look machine-generated, and it means a
# permissive pattern here (`.*`) switches the zero-config half off. Keep it exact.
#
# The owner-approved no-reply identities already present in this repository's history,
# and nothing else. A regex cannot tell a personal address from a work one, so the list is
# stated rather than inferred. The Anthropic no-reply address and both GitHub no-reply
# forms are all present in reachable history. No Codex/OpenAI address is added: none has
# been approved. If a legitimate new identity turns the ladder red, ask the owner for its
# approved non-personal commit address — do not infer one or delete the key.
AUTHOR_EMAIL_ALLOW='noreply@anthropic\.com|[^@]+@users\.noreply\.github\.com|noreply@github\.com'

# --- Multi-session plans (AMH P16) ------------------------------------------
PLAN_DIR=docs/plans

# --- Legislation: files whose diffs require the rule-review protocol (AMH P12)
#
# THIS FILE is in the list. It defines the thresholds, the poison tokens, the citation
# scope and this very list — so leaving it out lets an agent raise STATE_HARD_KB, blank
# POISON_TOKENS, or empty RULE_FILES itself, dismantling the tripwire with no warning.
# A scope list that does not cover the file defining the scope list is not a scope list.
#
# docs/STATE.md and docs/LEDGER.md are deliberately ABSENT even though their preambles
# are legislation: they change in nearly every unit, the tripwire is file-granular and
# cannot fire on a section, and warn fatigue kills tripwires. Their rule-bearing
# sections are prose-only — said plainly here and in the runbook rather than implied.
# harness/src is here as of 2026-07-27 (owner decision, DA-005). harness/templates was covered
# while the PRINCIPLES — the rules every adopter inherits, and the source the bundle is
# generated from — were not, so editing P2 tripped no advisory while editing a seed file did.
# CONTRIBUTING.md's scope list gained it in the same change; fixing the tripwire alone would
# have left the authority with the identical gap.
#
# What this entry does NOT do, stated because the first draft of its ledger row claimed
# otherwise: it does not remove the need to remember. P12 binds on what a diff IS, so the
# review is owed whether or not this fires; the advisory is a WARN and blocks nothing; and it
# only appears if someone runs the ladder while the change is still uncommitted. A courtesy,
# prose-only.
RULE_FILES='AGENTS.md docs/RUNBOOK.md CONTRIBUTING.md amh.conf scripts/ladder.sh scripts/test-ladder-guards.sh scripts/command-guard.sh scripts/redact.sh scripts/session-start.sh scripts/guards .claude/settings.json .codex/config.toml .codex/rules/amh.rules .codex/agents/amh-rule-reviewer.toml harness/templates harness/src'
